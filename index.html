  <style>
    /* заставка до готовности склада: лампочка BSLamp и полоска загрузки (стили здесь — видны сразу, до скриптов) */
    #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #f3efe6; transition: opacity .6s ease, visibility .6s; }
    :root[data-theme="dark"] #boot { background: #1b1b1e; }
    #boot.off { opacity: 0; visibility: hidden; }
    #boot .b-in { display: grid; justify-items: center; gap: 18px; }
    #boot svg { width: 56px; height: 56px; animation: boot-glow 1.4s ease-in-out infinite alternate; }
    #boot .b-bar { width: 140px; height: 3px; border-radius: 2px; background: rgba(31,29,25,.12); overflow: hidden; }
    #boot .b-bar i { display: block; height: 100%; width: calc(var(--p, 0.05) * 100%); background: #ffd400; transition: width .3s ease; }
    @keyframes boot-glow { from { filter: drop-shadow(0 0 0 rgba(255,212,0,0)); } to { filter: drop-shadow(0 0 14px rgba(255,212,0,.8)); } }
  </style>
